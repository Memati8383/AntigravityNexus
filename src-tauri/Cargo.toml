[package]
name = "antigravity-nexus"
version = "0.1.0"
description = "Antigravity & Kiro Modern Controller"
authors = ["Tris"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "antigravity_nexus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["blocking"] }
tauri = { version = "2.12.4", features = [] }
dirs = "6.0"
