name: Release & Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build Tauri Application
        run: |
          cd src-tauri
          cargo build --release

      - name: Prepare Binary
        shell: pwsh
        run: |
          Copy-Item "src-tauri/target/release/antigravity-nexus.exe" -Destination "AntigravityNexus.exe" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: AntigravityNexus.exe
          name: Antigravity Nexus ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
